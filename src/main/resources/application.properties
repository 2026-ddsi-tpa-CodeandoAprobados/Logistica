# --- Configuración de Base de Datos (Depende 100% de Variables de Entorno) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- URLs de Microservicios (Para la Integración) ---
donaciones.url=${DONACIONES_URL}
entidades.url=${ENTIDADES_URL}
incentivos.url=${INCENTIVOS_URL}

# --- Entrega 4 Parte B: Mensajería (CloudAMQP / RabbitMQ) ---
# Activá la mensajería async con el flag; sin él la app procesa la donación en modo sync (Parte A).
logistica.mensajeria.enabled=${MENSAJERIA_ENABLED:false}
logistica.mensajeria.cola=logistica.donaciones
# CloudAMQP entrega una URI amqps://user:pass@host/vhost -> Spring parsea credenciales, vhost y SSL.
spring.rabbitmq.addresses=${CLOUDAMQP_URL:}
# URL de la propia API de Logística que usa el Worker para dar de alta asignaciones / guardar stock.
logistica.url=${LOGISTICA_URL:http://localhost:${PORT:8080}}

# --- Servidor ---
server.port=${PORT:8080}

# --- Actuator & Métricas ---
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.datadog.metrics.export.enabled=true
management.datadog.metrics.export.api-key=${DD_API_KEY}

# --- Misceláneos ---
spring.devtools.restart.enabled=true
spring.cloud.compatibility-verifier.enabled=false
logging.level.ar.edu.utn.dds.k3003.clients=DEBUG
spring.cloud.openfeign.okhttp.enabled=true