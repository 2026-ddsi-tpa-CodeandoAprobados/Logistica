# Configuración para los tests: base en memoria, sin mensajería y sin exportar métricas.
# Define además las variables de entorno que application.properties espera, para que la
# aplicación levante en una máquina limpia y en CI.

spring.datasource.url=jdbc:h2:mem:logistica;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

DB_URL=jdbc:h2:mem:logistica
DB_USER=sa
DB_PASSWORD=
DD_API_KEY=test
DONACIONES_URL=http://localhost:9999
ENTIDADES_URL=http://localhost:9999
INCENTIVOS_URL=http://localhost:9999

logistica.mensajeria.enabled=false
management.datadog.metrics.export.enabled=false
# Sin reutilizar la lectura de depósitos: los tests miden estados que cambian en el momento.
logistica.metricas.vigencia-segundos=0
spring.devtools.restart.enabled=false
